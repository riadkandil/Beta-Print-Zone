<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Zone · money tests</title>
<style>
  :root{color-scheme:light dark;--ok:#1f8a4c;--bad:#c23434;--muted:#6b7280}
  body{margin:0;padding:16px;font:14px/1.5 system-ui,sans-serif;background:Canvas;color:CanvasText}
  h1{font-size:1.2rem;margin:0 0 4px}
  #summary{font-weight:700;margin:8px 0 12px}
  #summary.ok{color:var(--ok)} #summary.bad{color:var(--bad)}
  pre{white-space:pre-wrap;margin:0;font:12px/1.55 ui-monospace,monospace}
  .pass{color:var(--ok)} .fail{color:var(--bad);font-weight:700} .sec{color:var(--muted);font-weight:700;margin-top:10px;display:block}
  iframe{width:1280px;height:720px;border:1px solid #8884;margin-top:16px;max-width:100%}
</style>
</head>
<body>
<h1>Print Zone · money tests</h1>
<p>Runs only on the local demo copy (no Firebase): it writes test orders to this browser's local storage and puts the old data back at the end.</p>
<div id="summary">Running…</div>
<pre id="log"></pre>
<iframe id="app" title="app under test"></iframe>
<script>
'use strict';
/* ---------- tiny harness ---------- */
const logEl = document.getElementById('log');
let passed = 0, failed = 0;
const line = (cls, text) => { const s = document.createElement('span'); s.className = cls; s.textContent = text + '\n'; logEl.append(s); };
const section = name => line('sec', '— ' + name);
function ok(name, cond, detail) {
  if (cond) { passed++; line('pass', 'PASS ' + name); }
  else { failed++; line('fail', 'FAIL ' + name + (detail ? '  →  ' + detail : '')); }
}
const js = v => JSON.stringify(v);
const eq = (name, got, want) => ok(name, js(got) === js(want), 'got ' + js(got) + ', want ' + js(want));
const near = (name, got, want) => ok(name, Math.abs(got - want) < 0.005, 'got ' + got + ', want ' + want);
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function throwsCode(name, fn, code) {
  try { await fn(); ok(name, false, 'did not throw'); } catch (e) { eq(name, e.message, code); }
}

/* ---------- safety: local demo copy only ---------- */
const KEYS = ['pz_tx', 'pz_exp', 'pz_catalog', 'pz_lang', 'pz_seed', 'pz_settings'];
const saved = {};
async function guard() {
  if (!['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) throw new Error('Refusing to run: not on localhost.');
  const html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  if (/firebasejs/.test(html)) throw new Error('Refusing to run: this copy loads Firebase (live data). Run it on the demo copy.');
}

let win, E;
async function boot() {
  KEYS.forEach(k => { saved[k] = localStorage.getItem(k); });
  localStorage.setItem('pz_tx', '[]');
  localStorage.setItem('pz_exp', '[]');
  localStorage.removeItem('pz_catalog');
  localStorage.setItem('pz_lang', 'en');
  localStorage.setItem('pz_seed', '2');
  sessionStorage.setItem('pz_session', 'admin');
  const frame = document.getElementById('app');
  await new Promise(r => { frame.onload = r; frame.src = '../index.html?noseed=1'; });
  win = frame.contentWindow;
  E = code => win.eval(code);
  for (let i = 0; i < 100; i++) {
    try { if (E('state.role') === 'admin' && !win.document.getElementById('appView').hidden) break; } catch (e) { /* not ready */ }
    await sleep(100);
  }
  if (E('state.online')) throw new Error('Refusing to run: the app is online.');
}
function restore() {
  KEYS.forEach(k => { if (saved[k] == null) localStorage.removeItem(k); else localStorage.setItem(k, saved[k]); });
}

/* ---------- fixtures ---------- */
let T, D;
const item = (total, svc = 'A4') => ({ type: 'paper', svc, op: 'print', color: 'black', face: 'one', finish: 'normal', qty: 1, price: total, total });
const noonIso = day => new Date(day + 'T12:00:00').toISOString();
function order(id, day, client, total, payMethod, extra = {}) {
  return { id, date: D(day), client, total, payMethod, payOther: null, items: [item(total)], pieces: 1, engMeters: 0, notes: '', createdAt: noonIso(D(day)), createdBy: 'employee', ...extra };
}
/* Puts orders and costs into local storage through the app's own store */
async function load(txs, exps = []) {
  E('state.transactions = []; state.expenses = []; state.catalog = { books: [], office: [] }');
  localStorage.setItem('pz_catalog', JSON.stringify({ books: [], office: [] }));
  await E('store').importRecords(txs, exps);
}
const tx = id => E('state.transactions').find(x => x.id === id);

/* ---------- 1. pure money rules ---------- */
function testMoney() {
  section('Paid, owed and collected');
  const owed = E('owed'), paid = E('paidAmount'), cols = E('collections');
  const spot = order('a', 2, 'A', 100, 'cash');
  eq('paid on the spot: owes nothing', owed(spot), 0);
  eq('paid on the spot: collected on the order day', cols(spot), [{ date: D(2), method: 'cash', other: null, amount: 100 }]);
  const unpaid = order('b', 3, 'B', 200, 'notpaid');
  eq('unpaid: owes the total', owed(unpaid), 200);
  eq('unpaid: nothing collected', cols(unpaid), []);
  const part = order('c', 5, 'C', 150, 'notpaid', { payments: [{ amount: 50, method: 'cash', date: D(1), at: noonIso(D(1)), by: 'admin' }] });
  eq('part-paid: owes the rest', owed(part), 100);
  eq('part-paid: paid so far', paid(part), 50);
  eq('part-paid: collected on the payment day', cols(part), [{ date: D(1), method: 'cash', other: null, amount: 50 }]);
  const late = order('d', 9, 'D', 80, 'instapay', { paidAt: noonIso(D(4)) });
  eq('old format, marked paid later: collected on the paidAt day', cols(late), [{ date: D(4), method: 'instapay', other: null, amount: 80 }]);
  const settled = order('e', 9, 'E', 100, 'vodafone', { paidAt: noonIso(D(2)), payments: [{ amount: 60, method: 'cash', date: D(6) }, { amount: 40, method: 'vodafone', date: D(2) }] });
  eq('settled by two payments: one entry each, nothing extra', cols(settled).map(c => [c.date, c.method, c.amount]), [[D(6), 'cash', 60], [D(2), 'vodafone', 40]]);
  const raised = order('f', 9, 'F', 120, 'cash', { paidAt: noonIso(D(3)), payments: [{ amount: 100, method: 'cash', date: D(5) }] });
  eq('paid order whose total was raised: the difference comes in on the paid day', cols(raised).map(c => [c.date, c.amount]), [[D(5), 100], [D(3), 20]]);
  const mistake = order('g', 1, 'G', 70, 'notpaid', { mistake: true });
  eq('mistake: owes nothing', owed(mistake), 0);
  eq('mistake: nothing collected', cols(mistake), []);
  const cents = order('h', 1, 'H', 0.3, 'notpaid', { payments: [{ amount: 0.1, method: 'cash', date: D(0) }, { amount: 0.2, method: 'cash', date: D(0) }] });
  eq('rounding: 0.1 + 0.2 settles 0.30 exactly', owed(cents), 0);
  const nopay = { id: 'i', date: D(1), client: 'I', total: 30, items: [] };
  eq('very old order without payMethod counts as cash', cols(nopay).map(c => c.method), ['cash']);

  section('Recording a payment (oldest first)');
  const alloc = E('allocatePayment');
  const a1 = order('p1', 10, 'P', 100, 'notpaid'), a2 = order('p2', 4, 'P', 80, 'notpaid', { payments: [{ amount: 30, method: 'cash', date: D(3) }] });
  const res = alloc([a2, a1], { amount: 120, method: 'instapay', other: null, date: D(0), by: 'admin' });
  eq('120 goes to the oldest order first', res.map(r => [r.tx.id, r.patch.payments[r.patch.payments.length - 1].amount]), [['p1', 100], ['p2', 20]]);
  eq('the oldest order is settled: payMethod and paidAt set', [res[0].patch.payMethod, !!res[0].patch.paidAt], ['instapay', true]);
  eq('the next order stays unpaid with the rest owed', [res[1].patch.payMethod, 80 - 30 - 20], [undefined, 30]);
  eq('earlier payments are kept', res[1].patch.payments.length, 2);
  const exact = alloc([a1, a2], { amount: 150, method: 'cash', date: D(0), by: 'admin' });
  eq('paying exactly the total due settles every order', exact.map(r => r.patch.payMethod), ['cash', 'cash']);
  throwsCode('zero is refused', () => alloc([a1], { amount: 0, method: 'cash', date: D(0) }), 'pay.err.amount');
  throwsCode('more than owed is refused', () => alloc([a1, a2], { amount: 150.01, method: 'cash', date: D(0) }), 'pay.err.over');
  const other = alloc([a1], { amount: 10, method: 'other', other: 'Bank', date: D(0), by: 'admin' });
  eq('"Other" keeps its name', other[0].patch.payments[0].other, 'Bank');

  section('Change log entries');
  const entry = E('editEntry');
  const before = order('x', 3, 'Ahmed', 100, 'notpaid');
  eq('no change → no entry', entry(before, { ...before }, 'admin'), null);
  const after = { ...before, client: 'Ahmed Ali', total: 120, items: [item(120)], payMethod: 'cash', createdAt: noonIso(D(2)), date: D(2) };
  const e = entry(before, after, 'admin');
  eq('records who and what', [e.by, e.kind, Object.keys(e.changes).sort()], ['admin', 'edit', ['client', 'date', 'items', 'pay', 'time', 'total']]);
  eq('old → new values', [e.changes.total, e.changes.client, e.changes.pay], [{ from: 100, to: 120 }, { from: 'Ahmed', to: 'Ahmed Ali' }, { from: 'notpaid', to: 'cash' }]);
  const reordered = { ...before, items: before.items.map(it => Object.fromEntries(Object.entries(it).reverse())) };
  eq('same items in another key order are not a change', entry(before, reordered, 'admin'), null);
}

/* ---------- 2. client names ---------- */
function testClients() {
  section('Client names');
  const key = E('clientKey'), isDef = E('isDefaultClient');
  eq('hamza forms, spaces', [key('أحمد  علي '), key('احمد علي'), key('إحمد علي'), key('آحمد علي')].every(k => k === key('احمد علي')), true);
  eq('ta marbuta and alef maqsura', [key('فاطمة') === key('فاطمه'), key('مصطفى') === key('مصطفي')], [true, true]);
  eq('case and spaces in English', key(' ahmed   ALI ') === key('Ahmed Ali'), true);
  eq('Arabic digits', key('محل ١٢') === key('محل 12'), true);
  eq('diacritics are ignored', key('مُحَمَّد') === key('محمد'), true);
  eq('different names stay different', key('Ahmed') === key('Ahmad'), false);
  eq('the default name counts as no name', [isDef(''), isDef('  '), isDef('عميل'), isDef('Client'), isDef(' client '), isDef('Sara')], [true, true, true, true, true, false]);
  E('state.catalog').clientAliases = { [key('Ahmed Ali')]: 'أحمد علي', [key('A.Ali')]: 'Ahmed Ali' };
  const res = E('resolveClientKey');
  eq('a merged name points at its target', res('ahmed ali'), key('أحمد علي'));
  eq('merges chain', res('A.Ali'), key('أحمد علي'));
  E('state.catalog').clientAliases = { a: 'b', b: 'a' };
  ok('a merge loop cannot hang', typeof res('a') === 'string');
  E('state.catalog').clientAliases = {};
}

/* ---------- 3. totals: sales, collected, outstanding, daily report ---------- */
async function testTotals() {
  section('Sales, collected and outstanding');
  await load([
    order('s1', 2, 'A', 100, 'cash'),
    order('s2', 2, 'B', 50, 'vodafone'),
    order('s3', 1, 'C', 200, 'notpaid', { payments: [{ amount: 80, method: 'instapay', date: D(1) }] }),
    order('s4', 40, 'D', 300, 'cash', { paidAt: noonIso(D(1)) }),          // old debt, paid yesterday
    order('s5', 1, 'E', 999, 'cash', { mistake: true }),                   // excluded everywhere
    order('s6', 0, 'F', 45, 'other', { payOther: 'Bank' }),
    order('s7', 60, 'G', 500, 'notpaid'),                                  // old, still owed
  ], [{ id: 'c1', type: 'electricity', amount: 120, date: D(1) }, { id: 'c2', type: 'other', otherLabel: 'Rent', amount: 30, date: D(2) }]);
  const m = E('metrics')(D(2), D(0));
  eq('sales count orders by order date (mistakes out)', [m.sales, m.count], [395, 4]);
  eq('collected counts money by the day it came in', m.collected, 100 + 50 + 80 + 300 + 45);
  eq('costs', m.costs, 150);
  eq('net = collected − costs', m.net, 575 - 150);
  near('average order = sales / orders', m.avg, 395 / 4);
  eq('outstanding now = every open debt', E('outstandingNow')(), 120 + 500);
  const yday = E('metrics')(D(1), D(1));
  eq('yesterday: the old debt paid that day counts as collected, not as a sale', [yday.sales, yday.collected], [200, 80 + 300]);

  section('Daily report matches the KPIs');
  const rep = E('dailyReport')(D(2), D(0));
  eq('one row per day', rep.rows.map(r => r.key), [D(2), D(1), D(0)]);
  eq('totals = KPIs', [rep.total.orders, rep.total.sales, rep.total.collected, rep.total.costs, rep.total.net], [m.count, m.sales, m.collected, m.costs, m.net]);
  eq('collected split by method', [rep.total.cash, rep.total.instapay, rep.total.vodafone, rep.total.other], [400, 80, 50, 45]);
  eq('each day adds up', rep.rows.map(r => round(r.cash + r.instapay + r.vodafone + r.other) === r.collected), [true, true, true]);
  const yRow = rep.rows[1];
  eq('yesterday row', [yRow.orders, yRow.sales, yRow.collected, yRow.costs, yRow.net], [1, 200, 380, 120, 260]);
  const long = E('dailyReport')(D(120), D(0));
  ok('ranges past two months are reported by month', long.byMonth && long.rows.every(r => r.key.length === 7));
  eq('monthly totals still match', [long.total.sales, long.total.collected], [E('metrics')(D(120), D(0)).sales, E('metrics')(D(120), D(0)).collected]);
}
const round = n => Math.round(n * 100) / 100;

/* ---------- 4. the real screens (local store) ---------- */
async function addLine(total) {
  E('cart').lines = [{ ...item(total), id: 'l' + Math.random() }];
  E('renderCart')();
}
async function testNewOrder() {
  section('New order: a name is required when not paid');
  await load([]);
  E('resetCart')();
  await addLine(40);
  E('setPay')('notpaid');
  win.document.getElementById('cClient').value = '';
  await E('saveTx')();
  eq('blocked without a name', E('state.transactions').length, 0);
  ok('the client field is marked', win.document.getElementById('cClient').parentElement.classList.contains('need'));
  eq('the placeholder asks for it', win.document.getElementById('cClient').placeholder, E("t('newtx.clientReq')"));
  win.document.getElementById('cClient').value = 'عميل';
  await E('saveTx')();
  eq('the default name is not enough', E('state.transactions').length, 0);
  win.document.getElementById('cClient').value = 'Sara Hassan';
  await E('saveTx')();
  const saved = E('state.transactions')[0];
  eq('saved with the name', saved && [saved.client, saved.payMethod, saved.total], ['Sara Hassan', 'notpaid', 40]);
  await addLine(25);
  E('setPay')('cash');
  win.document.getElementById('cClient').value = '';
  await E('saveTx')();
  eq('paid orders still need no name', E('state.transactions').length, 2);
}

async function pay(txs, amount, method = 'cash') {
  const p = E('recordPayment')(txs, 'test');
  await sleep(60);
  const doc = win.document;
  ok('payment dialog opened', !doc.getElementById('payOverlay').hidden);
  if (method !== 'cash') doc.querySelector(`#payDlgChips [data-pay="${method}"]`).click();
  doc.getElementById('payAmt').value = amount;
  doc.getElementById('payYes').click();
  await sleep(30);
  return p;
}
async function testPayments() {
  section('Unpaid page: part-payments');
  await load([order('u1', 20, 'أحمد علي', 300, 'notpaid'), order('u2', 5, 'احمد  علي', 100, 'notpaid'), order('u3', 3, 'Mona', 60, 'notpaid')]);
  E('go')('pageUnpaid');
  const groups = E('unpaidGroups')();
  eq('two spellings of one client form one group', groups.map(g => [g.txs.length, g.owed]), [[2, 400], [1, 60]]);
  ok('the page lists both clients', win.document.querySelectorAll('#uList .cgroup').length === 2);
  // overpaying is refused in the dialog itself
  const p = E('recordPayment')([tx('u3')], 'Mona');
  await sleep(60);
  win.document.getElementById('payAmt').value = 61;
  win.document.getElementById('payYes').click();
  await sleep(30);
  ok('more than owed shows an error and keeps the dialog open', win.document.getElementById('payErr').textContent.length > 0 && !win.document.getElementById('payOverlay').hidden);
  win.document.getElementById('payNo').click();
  await p;
  eq('nothing was recorded', tx('u3').payments, undefined);
  await pay(groups[0].txs, 350, 'instapay');
  eq('350 settles the older order and part of the newer one', [tx('u1').payMethod, E('owed')(tx('u1')), tx('u2').payMethod, E('owed')(tx('u2'))], ['instapay', 0, 'notpaid', 50]);
  ok('the settled order has paidAt', !!tx('u1').paidAt);
  eq('payments carry date, method and who', [tx('u2').payments[0].date, tx('u2').payments[0].method, tx('u2').payments[0].by], [D(0), 'instapay', 'admin']);
  eq('outstanding drops by 350', E('outstandingNow')(), 110);
  eq('collected today rises by 350', E('metrics')(D(0), D(0)).collected, 350);
  await pay([tx('u2')], 50);
  eq('the rest settles the order', [tx('u2').payMethod, E('owed')(tx('u2'))], ['cash', 0]);
  // the app repaints on the next animation frame, which headless runs never fire, so paint now
  E('renderBadges')();
  eq('the sidebar badge counts only orders that owe', win.document.getElementById('unpaidBadge').textContent, '1');

  section('Merging client names');
  await load([order('m1', 2, 'Ahmed Ali', 10, 'notpaid'), order('m2', 1, 'أحمد علي', 20, 'notpaid')]);
  eq('different scripts are two clients before merging', E('unpaidGroups')().length, 2);
  await E('saveAliases')({ [E('resolveClientKey')('Ahmed Ali')]: 'أحمد علي' });
  const merged = E('unpaidGroups')();
  eq('after merging they are one client under the target name', merged.map(g => [g.name, g.owed]), [['أحمد علي', 30]]);
  await E('saveAliases')({});
  eq('undoing the merge splits them again', E('unpaidGroups')().length, 2);
}

async function testEdits() {
  section('Admin edit: anything, with a change log');
  await load([order('e1', 6, 'Omar', 100, 'notpaid', { payments: [{ amount: 30, method: 'cash', date: D(2), at: noonIso(D(2)), by: 'employee' }] })]);
  E("go('pageUnpaid')");
  await E('editTransaction')(tx('e1'));
  eq('editing opens the order in the cart', E('cart.lines.length'), 1);
  ok('the time field shows while editing', !win.document.getElementById('cTimeWrap').hidden);
  // below what was already paid: refused
  E('cart').lines[0].total = 20; E('cart').lines[0].price = 20;
  await E('saveTx')();
  eq('a total below the 30 already paid is refused', tx('e1').total, 100);
  // raise the price, change the name and the time
  E('cart').lines[0].total = 120; E('cart').lines[0].price = 120;
  win.document.getElementById('cClient').value = 'Omar Khaled';
  win.document.getElementById('cTime').value = '09:15';
  await E('saveTx')();
  const t1 = tx('e1');
  eq('saved: total, name, payments kept', [t1.total, t1.client, t1.payments.length, E('owed')(t1)], [120, 'Omar Khaled', 1, 90]);
  const d = new Date(t1.createdAt);
  eq('the time was changed', [d.getHours(), d.getMinutes(), t1.date], [9, 15, D(6)]);
  const log = t1.edits[t1.edits.length - 1];
  eq('the change log records old → new', [log.by, log.changes.total, log.changes.client.to, !!log.changes.time, !!log.changes.items], ['admin', { from: 100, to: 120 }, 'Omar Khaled', true, true]);
  eq('saving goes back to the page the edit started from', E('state.page'), 'pageUnpaid');
  // correct the payment: it was paid in cash after all
  await E('editTransaction')(tx('e1'));
  E('setPay')('cash');
  await E('saveTx')();
  const t2 = tx('e1');
  eq('switching to paid settles it and keeps the earlier payment', [t2.payMethod, !!t2.paidAt, t2.payments.length, E('owed')(t2)], ['cash', true, 1, 0]);
  eq('collected: the payment on its day, the rest today', E('collections')(t2).map(c => [c.date, c.amount]), [[D(2), 30], [D(0), 90]]);
  eq('two log entries now', t2.edits.length, 2);
  // and back to not paid: the debt returns in full
  await E('editTransaction')(tx('e1'));
  E('setPay')('notpaid');
  await E('saveTx')();
  const t3 = tx('e1');
  eq('switching a paid order back to not paid makes the whole total owed', [t3.payMethod, t3.payments.length, t3.paidAt, E('owed')(t3)], ['notpaid', 0, null, 120]);
}

async function confirmDialog(yes) {
  await sleep(40);
  const sub = win.document.getElementById('confirmSub').textContent;
  win.document.getElementById(yes ? 'confirmYes' : 'confirmNo').click();
  await sleep(30);
  return sub;
}
async function testMistakes() {
  section('Mistakes are logged and warn about debts');
  await load([order('k1', 2, 'Sara', 75, 'notpaid')]);
  E('state').role = 'employee';
  const p = E('txAction')('mistake', tx('k1'));
  const sub = await confirmDialog(true);
  await p;
  ok('the warning names the debt that will be removed', sub.includes('75.00'));
  eq('marked as a mistake with a log entry', [tx('k1').mistake, tx('k1').edits.map(e => [e.kind, e.by])], [true, [['mistake', 'employee']]]);
  eq('the debt leaves Unpaid and every total', [E('owed')(tx('k1')), E('outstandingNow')(), E('metrics')(D(2), D(2)).sales], [0, 0, 0]);
  E('state').role = 'admin';
  await E('txAction')('mistake', tx('k1'));
  eq('unmarking is logged too', tx('k1').edits.map(e => e.kind), ['mistake', 'unmistake']);
  eq('and the debt is back', E('owed')(tx('k1')), 75);
}

async function testScreens() {
  section('Rename and dashboard');
  eq('English name', E("I18N.en['cat.shop']"), 'Writing Category');
  eq('Arabic name', E("I18N.ar['cat.shop']"), 'قسم الكتابة');
  E("go('pageNew')");
  await sleep(50);
  ok('the New order page shows the new name', [...win.document.querySelectorAll('#svcGrid .sec-title')].some(h => h.textContent === 'Writing Category'));
  await load([order('z1', 0, 'A', 100, 'cash'), order('z2', 0, 'B', 40, 'notpaid')], [{ id: 'x', type: 'internet', amount: 25, date: D(0) }]);
  E("DS.range = 'today'; go('pageDashboard')");
  await sleep(80);
  const doc = win.document;
  ok('no busy-times, top-clients or 12-month cards', !doc.getElementById('cHeat') && !doc.getElementById('cClients') && !doc.getElementById('cMonths'));
  ok('no hourly analysis', !/hour|ساعة/i.test(doc.getElementById('pageDashboard').textContent));
  eq('hero shows sales', doc.querySelector('.kpi.hero .hero-value').firstChild.textContent, '140');
  const vals = [...doc.querySelectorAll('#dKpis .kpi:not(.hero) .kpi-value')].map(v => v.textContent);
  eq('collected, outstanding, costs, net, orders, average', vals, ['100', '40', '25', '75', '2', '70']);
  const foot = [...doc.querySelectorAll('#cDaily tbody tr td')].map(td => td.textContent);

/* ---------- 5. data completeness: the live window + unpaid + settled listeners, on a fake Firestore ---------- */
function fakeDb(all) {
  const field = (d, f) => (f === '__id__' ? d.id : d[f]);
  const query = (filters = [], order = null, lim = null, after = null) => ({
    where: (f, op, v) => query([...filters, [f, op, v]], order, lim, after),
    orderBy: f => query(filters, f, lim, after),
    limit: n => query(filters, order, n, after),
    startAfter: d => query(filters, order, lim, d),
    run() {
      let r = all.filter(d => filters.every(([f, op, v]) => {
        const x = d[f];
        if (x === undefined || x === null) return false;
        return op === '>=' ? x >= v : op === '<' ? x < v : op === '==' ? x === v : false;
      }));
      const k = order || '__id__';
      r.sort((a, b) => (field(a, k) < field(b, k) ? -1 : field(a, k) > field(b, k) ? 1 : a.id < b.id ? -1 : 1));
      if (after) r = r.slice(r.findIndex(d => d.id === after.id) + 1);
      if (lim) r = r.slice(0, lim);
      return r.map(d => ({ id: d.id, data: () => { const { id, ...rest } = d; return rest; } }));
    },
    get() { reads.n += 1; const docs = this.run(); return Promise.resolve({ docs, size: docs.length }); },
    onSnapshot(cb) { cb({ docs: this.run() }); return () => {}; },
    doc: id => ({ update: () => Promise.resolve(), delete: () => Promise.resolve() }),
  });
  const reads = { n: 0 };
  return { reads, collection: () => query(), batch: () => ({ update() {}, commit: () => Promise.resolve() }) };
}
async function testCompleteness() {
  section('No order goes missing online (fake Firestore, 6,000 orders)');
  const all = [];
  for (let i = 0; i < 6000; i++) {
    const day = Math.floor(i / 10);          // 10 a day over 600 days
    const o = { id: 'f' + String(i).padStart(5, '0'), date: D(day), client: 'C' + (i % 40), total: 10 + (i % 7), payMethod: i % 13 === 0 ? 'notpaid' : 'cash', items: [] };
    if (i % 50 === 0) o.createdAt = undefined; else o.createdAt = noonIso(D(day));
    if (i % 97 === 0 && day > 120) { o.payMethod = 'instapay'; o.paidAt = noonIso(D(3)); }   // old orders paid recently
    all.push(o);
  }
  const fdb = fakeDb(all);
  win.__fdb = fdb;
  win.firebase = { firestore: { FieldPath: { documentId: () => '__id__' } } };
  E("db = window.__fdb; store = FireStore; FireStore.src = { older: {}, settled: {}, unpaid: {}, recent: {} }; FireStore.watchTransactions()");
  const from = E('FireStore.loadedFrom');
  const expect = all.filter(o => o.date >= from || o.payMethod === 'notpaid' || (o.paidAt && o.paidAt >= new Date(from + 'T00:00:00').toISOString()));
  const ids = E('state.transactions').map(x => x.id);
  eq('live set = recent window ∪ every unpaid ∪ settled since', [ids.length, new Set(ids).size], [expect.length, expect.length]);
  ok('more than the window: old unpaid orders are there', ids.includes('f05850'));     // day 585, unpaid (i % 13 === 0)
  ok('old orders paid recently are there (so today\'s collected is right)', ids.includes('f01261'));
  ok('orders without createdAt are not dropped', ids.includes('f00050'));
  eq('collected over the last 4 days matches the full data', E('metrics')(D(3), D(0)).collected,
    round(all.flatMap(o => E('collections')(o)).filter(c => c.date >= D(3) && c.date <= D(0)).reduce((s, c) => s + c.amount, 0)));
  const reads0 = fdb.reads.n;
  await E('FireStore').ensureLoaded(D(300));
  const after = E('state.transactions');
  eq('a year-old range loads on demand, without duplicates', [after.filter(o => o.date >= D(300)).length, new Set(after.map(o => o.id)).size === after.length], [all.filter(o => o.date >= D(300)).length, true]);
  ok('paged reads were used', fdb.reads.n - reads0 >= 2);
  eq('the first loaded date moves back', E('FireStore.loadedFrom'), D(300));
  await E('FireStore').ensureLoaded('');
  eq('a full backup sees all 6,000 orders', E('state.transactions').length, 6000);
  await E('FireStore').updateTx('f05990', { client: 'Patched' });
  eq('an order fetched on demand is patched locally after an edit', tx('f05990').client, 'Patched');
}
